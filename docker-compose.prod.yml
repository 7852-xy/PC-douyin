# 云端全栈部署：API + Postgres + Redis + MinIO（一条命令起整套）
# 用法（VPS 上，项目根目录）：
#   POSTGRES_PASSWORD=强密码 MINIO_ROOT_PASSWORD=强密码 JWT_SECRET=强密钥 \
#   docker compose -f docker-compose.prod.yml up -d --build
# API 只绑定 127.0.0.1:3000，由 nginx 反代对外（见 deploy/nginx.conf）
# 密钥也可写入根目录 .env（compose 自动读取），避免写在命令行里

services:
  api:
    build: ./server
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://pcdouyin:${POSTGRES_PASSWORD:-pcdouyin}@postgres:5432/pcdouyin
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-pcdouyin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-pcdouyin-secret}
      S3_BUCKET: pcdouyin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_REFRESH_ENABLED: 'true'
      PORT: '3000'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcdouyin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcdouyin}
      POSTGRES_DB: pcdouyin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pcdouyin -d pcdouyin']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pcdouyin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pcdouyin-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性初始化：建桶 + 公共读（媒体经 /media 代理，无需签名）
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-pcdouyin} ${MINIO_ROOT_PASSWORD:-pcdouyin-secret} &&
      mc mb -p local/pcdouyin &&
      mc anonymous set download local/pcdouyin &&
      echo 'bucket pcdouyin ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
