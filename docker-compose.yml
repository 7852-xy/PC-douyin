# 生产基础设施：Postgres + Redis + MinIO（S3 兼容对象存储）
# 用法：docker compose up -d
# 配套 server/.env（参考 server/.env.example）：
#   DATABASE_URL=postgresql://pcdouyin:pcdouyin@localhost:5432/pcdouyin
#   REDIS_URL=redis://localhost:6379
#   S3_ENDPOINT=http://localhost:9000
#   S3_BUCKET=pcdouyin
#   JWT_REFRESH_ENABLED=true
# 之后：
#   npm run db:migrate:pg   # Postgres 迁移
#   npm run db:generate:pg  # 生成 Postgres client
#   npm run start

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcdouyin
      POSTGRES_PASSWORD: pcdouyin
      POSTGRES_DB: pcdouyin
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pcdouyin -d pcdouyin']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: pcdouyin
      MINIO_ROOT_PASSWORD: pcdouyin-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 控制台
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性初始化：创建 bucket 并放开公共读（媒体经 /media 代理给客户端，无需签名）
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pcdouyin pcdouyin-secret &&
      mc mb -p local/pcdouyin &&
      mc anonymous set download local/pcdouyin &&
      echo 'bucket pcdouyin ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
