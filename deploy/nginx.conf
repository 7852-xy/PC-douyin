# PC抖音 API 反向代理模板（Ubuntu + nginx）
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pcdouyin.conf
#   sudo ln -s /etc/nginx/sites-available/pcdouyin.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 把 pcdouyin.example.com 换成你的域名（A 记录指向 VPS）。
# HTTPS：sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d pcdouyin.example.com
#   certbot 会自动把 80 改写为 443 + 证书自动续期。

server {
    listen 80;
    server_name pcdouyin.example.com;

    # 视频上传体积上限（与服务端 multer 上限一致偏宽松）
    client_max_body_size 200m;

    # electron-updater 更新源（可选）：把 dist2/latest.yml 与 PCDouyin Setup x.y.z.exe
    # 放到 /var/www/pcdouyin/updates/ 即可被客户端自动更新拉取
    location /updates/ {
        alias /var/www/pcdouyin/updates/;
        add_header Cache-Control "no-cache"; # latest.yml 必须每次校验
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频 Range 拉流（206）直传，不缓冲
        proxy_buffering off;
    }
}
